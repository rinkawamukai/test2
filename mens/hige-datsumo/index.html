<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><title>Blog Components Sample</title><link rel="stylesheet" href="style.css"></head><body>
<div class="blog-container">
<h1>追加コンポーネントサンプル</h1>
<p>これは <span class="blog-inline-emphasis">強調表示</span> の例です。</p>

<div class="blog-balloon">
 <div class="blog-balloon-icon">💬</div>
 <div class="blog-balloon-content">ヒゲ脱毛は女性受けだけで判断しないほうが合理的です。</div>
</div>

<ul class="blog-checklist">
<li>青ヒゲが強い</li>
<li>毎朝ヒゲを剃る</li>
<li>剃刀負けしやすい</li>
</ul>

<div class="blog-pros-cons">
<div class="blog-pros"><strong>メリット</strong><ul><li>清潔感向上</li><li>時短</li></ul></div>
<div class="blog-cons"><strong>デメリット</strong><ul><li>費用発生</li><li>痛み</li></ul></div>
</div>

<table class="blog-table">
<tr><th>項目</th><th>脱毛前</th><th>脱毛後</th></tr>
<tr><td>青ヒゲ</td><td>目立つ</td><td>目立ちにくい</td></tr>
<tr><td>手入れ時間</td><td>毎日必要</td><td>短縮</td></tr>
</table>
</div></body></html>
